    <style>
      :root {
        --ink: #1e2923;
        --muted: #5c6b61;
        --green: #244839;
        --green-hover: #1b362b;
        --line: #e2e5dc;
        --paper: #f7f8f4;
        --white: #ffffff;
        --primary-shadow: 0 4px 20px -2px rgba(36, 72, 57, 0.08);
        --card-shadow: 0 2px 12px rgba(0, 0, 0, 0.03);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--paper);
        color: var(--ink);
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      button,
      a,
      select {
        -webkit-tap-highlight-color: transparent;
      }
      button,
      select {
        font: inherit;
      }
      button,
      a,
      select {
        touch-action: manipulation;
      }
      button {
        cursor: pointer;
        transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      }
      button:hover {
        transform: translateY(-1px);
      }
      button:active {
        transform: translateY(0);
      }
      button:focus-visible,
      a:focus-visible,
      select:focus-visible {
        outline: 3px solid #2d5947;
        outline-offset: 2px;
      }
      button:disabled {
        opacity: 0.4;
        transform: none !important;
        cursor: not-allowed;
      }
      .shell {
        max-width: 1080px;
        padding: 0 24px;
        margin: auto;
      }
      .masthead {
        height: 80px;
        border-bottom: 1px solid var(--line);
        display: flex;
        align-items: center;
        justify-content: space-between;
        background: rgba(247, 248, 244, 0.85);
        backdrop-filter: blur(8px);
        position: sticky;
        top: 0;
        z-index: 10;
      }
      .brand {
        display: flex;
        gap: 12px;
        align-items: center;
        font-size: 20px;
        font-weight: 700;
        letter-spacing: 0.5px;
      }
      .brand-icon {
        width: 40px;
        height: 40px;
        display: grid;
        place-items: center;
        background: #e2ebdf;
        border-radius: 12px;
        font-size: 24px;
        color: #485c3b;
      }
      .brand-sub {
        display: block;
        font-size: 10px;
        letter-spacing: 1.5px;
        margin-top: 3px;
        font-weight: 600;
        color: var(--muted);
      }
      .family-label {
        font-size: 13px;
        color: var(--muted);
        border: 1px solid var(--line);
        padding: 6px 14px;
        border-radius: 20px;
        background: var(--white);
        box-shadow: var(--card-shadow);
      }
      .intro {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 20px;
        padding: 36px 0 20px;
      }
      .eyebrow {
        font-size: 12px;
        letter-spacing: 1.5px;
        color: #4a6b46;
        font-weight: 700;
        margin: 0 0 8px;
        text-transform: uppercase;
      }
      .intro .eyebrow {
        font-size: 12px;
        letter-spacing: 2px;
      }
      h1 {
        font-size: 32px;
        letter-spacing: -0.5px;
        line-height: 1.25;
        margin: 0;
        font-weight: 800;
      }
      .subtitle {
        color: var(--muted);
        font-size: 15px;
        margin: 10px 0 0;
      }
      .share {
        min-height: 44px;
        border: 1px solid #cbd5c5;
        background: var(--white);
        border-radius: 12px;
        padding: 0 16px;
        font-weight: 600;
        color: var(--green);
        white-space: nowrap;
        box-shadow: var(--card-shadow);
        display: inline-flex;
        align-items: center;
      }
      .share:hover {
        background: #f0f4ee;
        border-color: var(--green);
      }
      .share span {
        padding-left: 8px;
        font-size: 18px;
      }
      .settings {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 0 0 24px;
        font-size: 13px;
        color: var(--muted);
      }
      .dot {
        display: inline-block;
        width: 6px;
        height: 6px;
        background: #4a6b46;
        border-radius: 50%;
        margin-right: 6px;
      }
      .settings label {
        display: flex;
        gap: 8px;
        align-items: center;
        background: var(--white);
        padding: 4px 12px;
        border-radius: 12px;
        border: 1px solid var(--line);
        box-shadow: var(--card-shadow);
      }
      .settings select {
        min-height: 36px;
        border: 0;
        background: transparent;
        color: var(--ink);
        font-weight: 600;
        cursor: pointer;
      }
      .today-section {
        background: #eef2ea;
        border: 1px solid #d4decb;
        border-radius: 24px;
        padding: 28px;
        margin-bottom: 36px;
        box-shadow: var(--primary-shadow);
      }
      .section-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 15px;
        margin-bottom: 20px;
      }
      h2 {
        font-size: 22px;
        font-weight: 700;
        margin: 0;
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .count {
        font-size: 12px;
        font-weight: 600;
        color: #3b5439;
        background: #d8e4cf;
        padding: 4px 10px;
        border-radius: 20px;
      }
      .date-navigation {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 14px;
        background: var(--white);
        padding: 4px;
        border-radius: 12px;
        border: 1px solid var(--line);
        box-shadow: var(--card-shadow);
      }
      .date-navigation button {
        border: 0;
        background: #f4f7f1;
        border-radius: 8px;
        min-height: 36px;
        min-width: 36px;
        color: var(--green);
        font-size: 18px;
        display: grid;
        place-items: center;
      }
      .date-navigation button:hover {
        background: #e4ecd9;
      }
      .date-navigation span {
        white-space: nowrap;
        padding: 0 8px;
        font-weight: 600;
      }
      .today-cards {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
        gap: 16px;
      }
      .course {
        background: var(--white);
        padding: 24px;
        border: 1px solid var(--line);
        border-radius: 18px;
        min-width: 0;
        box-shadow: var(--card-shadow);
        transition: all 0.25s ease;
      }
      .course:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.05);
        border-color: #cbd5c5;
      }
      .course-top {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .course-icon {
        width: 44px;
        height: 44px;
        border-radius: 14px;
        display: grid;
        place-items: center;
        flex-shrink: 0;
        font-size: 18px;
        font-weight: 700;
      }
      .blue {
        background: #e4effb;
        color: #3b5d8c;
      }
      .rose {
        background: #fce8e3;
        color: #a8523c;
      }
      .green {
        background: #e4ede0;
        color: #4b6b3c;
      }
      .amber {
        background: #fcf1de;
        color: #9e732b;
      }
      .course-heading {
        min-width: 0;
      }
      .course-heading h3 {
        font-size: 19px;
        margin: 0 0 4px;
        font-weight: 700;
      }
      .course-heading p {
        font-size: 13px;
        margin: 0;
        color: var(--muted);
      }
      /* 保留原始代码中加载进来的其余动态样式与脚本逻辑 */
