<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="robots" content="noindex,nofollow" />
    <title>兴趣班课表</title>
    <!-- 页面样式 -->
    <style>
      :root {
        --ink: #243d35;
        --muted: #67756c;
        --green: #2d5947;
        --line: #dedfd6;
        --paper: #faf9f5;
        --white: #fffefa;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--paper);
        color: var(--ink);
        font-family: Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      button,
      a,
      select {
        -webkit-tap-highlight-color: transparent;
      }
      button,
      select {
        font: inherit;
      }
      button,
      a,
      select {
        touch-action: manipulation;
      }
      button {
        cursor: pointer;
      }
      button:focus-visible,
      a:focus-visible,
      select:focus-visible {
        outline: 3px solid #b57928;
        outline-offset: 4px;
      }
      button:disabled {
        opacity: 0.4;
      }
      .shell {
        max-width: 1080px;
        padding: 0 42px;
        margin: auto;
      }
      .masthead {
        height: 94px;
        border-bottom: 1px solid var(--line);
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .brand {
        display: flex;
        gap: 12px;
        align-items: center;
        font-size: 20px;
        font-weight: 700;
        letter-spacing: 1px;
      }
      .brand-icon {
        width: 42px;
        height: 42px;
        display: grid;
        place-items: center;
        background: #e8eddf;
        border-radius: 14px;
        font-size: 28px;
        color: #687947;
      }
      .brand-sub {
        display: block;
        font-size: 9px;
        letter-spacing: 2px;
        margin-top: 5px;
        font-weight: 500;
        color: var(--muted);
      }
      .family-label {
        font-size: 13px;
        color: var(--muted);
        border: 1px solid var(--line);
        padding: 7px 13px;
        border-radius: 30px;
      }
      .intro {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 20px;
        padding: 42px 0 26px;
      }
      .eyebrow {
        font-size: 11px;
        letter-spacing: 2px;
        color: #637f60;
        font-weight: 700;
        margin: 0 0 12px;
      }
      .intro .eyebrow {
        font-size: 13px;
        letter-spacing: 3px;
      }
      h1 {
        font-size: 38px;
        letter-spacing: -1px;
        line-height: 1.3;
        margin: 0;
        font-weight: 700;
      }
      .subtitle {
        color: var(--muted);
        font-size: 16px;
        margin: 14px 0 0;
      }
      .share {
        min-height: 46px;
        border: 1px solid #c5ccbf;
        background: transparent;
        border-radius: 10px;
        padding: 0 17px;
        font-weight: 600;
        color: var(--green);
        white-space: nowrap;
      }
      .share span {
        padding-left: 12px;
        font-size: 20px;
      }
      .settings {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 0 0 26px;
        font-size: 13px;
        color: var(--muted);
      }
      .dot {
        display: inline-block;
        width: 7px;
        height: 7px;
        background: #64875b;
        border-radius: 50%;
        margin-right: 7px;
      }
      .settings label {
        display: flex;
        gap: 8px;
        align-items: center;
      }
      .settings select {
        min-height: 44px;
        border: 0;
        background: transparent;
        color: var(--ink);
        max-width: 145px;
      }
      .today-section {
        background: #eef1e8;
        border: 1px solid #dce3d6;
        border-radius: 20px;
        padding: 28px;
        margin-bottom: 42px;
      }
      .section-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 15px;
        margin-bottom: 22px;
      }
      h2 {
        font-size: 25px;
        font-weight: 700;
        margin: 0;
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .count {
        font-size: 13px;
        font-weight: 500;
        color: #536c51;
        background: #dfe7d7;
        padding: 5px 10px;
        border-radius: 20px;
      }
      .date-navigation {
        display: flex;
        align-items: center;
        gap: 9px;
        font-size: 14px;
      }
      .date-navigation button {
        border: 1px solid #d1dacb;
        background: #f8faf4;
        border-radius: 8px;
        min-height: 44px;
        min-width: 44px;
        color: var(--green);
        font-size: 25px;
      }
      .date-navigation span {
        white-space: nowrap;
      }
      .today-cards {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
        gap: 16px;
      }
      .course {
        background: var(--white);
        padding: 23px;
        border: 1px solid #e2e3da;
        border-radius: 14px;
        min-width: 0;
      }
      .course-top {
        display: flex;
        align-items: center;
        gap: 13px;
      }
      .course-icon {
        width: 43px;
        height: 43px;
        border-radius: 12px;
        display: grid;
        place-items: center;
        flex-shrink: 0;
        font-size: 19px;
        font-weight: 700;
      }
      .blue {
        background: #e7edf6;
        color: #4c6381;
      }
      .rose {
        background: #f4e5df;
        color: #965d4d;
      }
      .green {
        background: #e7eddf;
        color: #64754d;
      }
      .amber {
        background: #f5ebd6;
        color: #947338;
      }
      .course-heading {
        min-width: 0;
      }
      .course-heading h3 {
        font-size: 21px;
        margin: 0 0 5px;
        font-weight: 700;
      }
      .course-heading p {
        font-size: 14px;
        margin: 0;
        color: var(--muted);
      }
      .duration {
        margin-left: auto;
        font-size: 12px;
        color: var(--muted);
        white-space: nowrap;
      }
      .time {
        font-size: 21px;
        font-weight: 700;
        margin-top: 20px;
        line-height: 1.6;
        letter-spacing: -0.4px;
      }
      .time span {
        font-weight: 400;
        color: #8d988c;
        font-size: 16px;
        margin: 0 4px;
      }
      .featured .time {
        font-size: 29px;
        margin-top: 24px;
      }
      .location {
        display: flex;
        align-items: flex-start;
        gap: 9px;
        color: #5f6d62;
        font-size: 15px;
        line-height: 1.7;
        margin: 12px 0 21px;
        overflow-wrap: anywhere;
      }
      .location svg {
        width: 16px;
        height: 19px;
        flex-shrink: 0;
        margin-top: 3px;
      }
      .navigate {
        background: #edf1e9;
        border: 1px solid #d7dfd1;
        color: var(--green);
        text-decoration: none;
        border-radius: 9px;
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 9px;
        font-size: 17px;
        font-weight: 700;
        min-height: 49px;
      }
      .navigate svg {
        width: 18px;
        height: 21px;
      }
      .navigate > span {
        margin-left: 6px;
      }
      .featured .navigate {
        background: var(--green);
        color: white;
        border-color: var(--green);
        min-height: 54px;
      }
      .navigate:hover {
        filter: brightness(0.96);
      }
      .back-today {
        color: var(--green);
        border: 1px solid #c6d2bd;
        background: #fffdf7;
        padding: 11px 15px;
        border-radius: 9px;
        margin: 0 0 18px;
        font-size: 14px;
      }
      .week-section .eyebrow {
        color: var(--muted);
      }
      .week-range {
        font-size: 14px;
        color: var(--muted);
      }
      .week-list {
        border-top: 1px solid var(--line);
      }
      .day-row {
        display: grid;
        grid-template-columns: 106px 1fr;
        gap: 20px;
        padding: 24px 0;
        border-bottom: 1px solid var(--line);
      }
      .day-label {
        padding-top: 8px;
      }
      .day-label strong {
        display: block;
        font-size: 18px;
      }
      .day-label > span {
        display: block;
        color: var(--muted);
        font-size: 14px;
        margin-top: 8px;
      }
      .day-label small {
        display: inline-block;
        margin-top: 10px;
        background: var(--green);
        color: white;
        border-radius: 4px;
        padding: 4px 8px;
        font-size: 11px;
      }
      .day-courses {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
        gap: 14px;
      }
      .rest {
        padding: 18px 0;
        font-size: 17px;
        color: #687764;
      }
      .rest span {
        display: block;
        font-size: 14px;
        margin-top: 7px;
        color: #7d8779;
      }
      .empty {
        padding: 25px;
        text-align: center;
      }
      .empty > span {
        font-size: 40px;
        color: #87966e;
      }
      .empty h3 {
        font-size: 23px;
        margin: 12px 0;
      }
      .empty p {
        color: var(--muted);
        font-size: 16px;
      }
      footer {
        padding: 30px 0 38px;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.8;
      }
      footer p {
        margin: 4px 0;
      }
      footer > span {
        display: block;
        margin-top: 22px;
        font-size: 13px;
        letter-spacing: 1px;
      }
      .note {
        font-size: 15px;
        line-height: 1.7;
      }
      .change {
        font-size: 13px;
        color: #94642f;
      }
      .toast {
        position: fixed;
        left: 50%;
        bottom: 25px;
        transform: translateX(-50%);
        background: #243d35;
        color: white;
        border-radius: 12px;
        padding: 15px 22px;
        max-width: 90vw;
        width: max-content;
        font-size: 15px;
        box-shadow: 0 4px 24px #0002;
        z-index: 10;
      }
      @media (min-width: 800px) {
        .today-cards:has(> .course:only-child) .featured {
          display: grid;
          grid-template-columns: 1fr 240px;
          column-gap: 28px;
        }
        .today-cards:has(> .course:only-child) .featured .course-top,
        .today-cards:has(> .course:only-child) .featured .time,
        .today-cards:has(> .course:only-child) .featured .location {
          grid-column: 1;
        }
        .today-cards:has(> .course:only-child) .featured .navigate {
          grid-column: 2;
          grid-row: 1/4;
          align-self: center;
        }
        .featured .location {
          margin-bottom: 0;
        }
      }
      @media (max-width: 650px) {
        .shell {
          padding: 0 18px;
        }
        .masthead {
          height: 76px;
        }
        .intro {
          padding: 28px 0 20px;
          display: block;
        }
        h1 {
          font-size: 32px;
        }
        .intro .eyebrow {
          font-size: 12px;
        }
        .subtitle {
          font-size: 15px;
        }
        .share {
          margin-top: 18px;
          min-height: 46px;
        }
        .settings {
          font-size: 12px;
          gap: 6px;
          flex-wrap: wrap;
          padding-bottom: 17px;
        }
        .settings label {
          gap: 2px;
        }
        .today-section {
          padding: 18px 14px;
          border-radius: 16px;
          margin-bottom: 32px;
        }
        .today-section .section-head {
          align-items: flex-start;
          flex-direction: column;
          gap: 16px;
        }
        .date-navigation {
          width: 100%;
          justify-content: space-between;
          font-size: 16px;
        }
        .today-cards {
          grid-template-columns: minmax(0, 1fr);
        }
        .course {
          padding: 19px 16px;
        }
        .featured .time {
          font-size: 25px;
          white-space: normal;
        }
        .duration {
          font-size: 11px;
        }
        .time {
          font-size: 21px;
        }
        .location {
          font-size: 16px;
        }
        .week-section > .section-head {
          gap: 8px;
        }
        .week-range {
          font-size: 12px;
        }
        h2 {
          font-size: 23px;
        }
        .day-row {
          display: block;
          padding: 19px 0;
        }
        .day-label {
          display: flex;
          gap: 10px;
          align-items: center;
          padding: 0;
          margin-bottom: 13px;
        }
        .day-label strong {
          font-size: 18px;
        }
        .day-label > span {
          margin: 0;
          font-size: 13px;
        }
        .day-label small {
          margin: 0 0 0 auto;
        }
        .day-courses {
          grid-template-columns: minmax(0, 1fr);
        }
        .rest {
          padding: 10px 0;
        }
        .rest span {
          display: inline;
          margin-left: 12px;
          font-size: 13px;
        }
        .navigate {
          min-height: 52px;
        }
        .eyebrow {
          font-size: 10px;
        }
        footer {
          font-size: 12px;
        }
      }
      @media print {
        .share,
        .settings,
        .date-navigation,
        .back-today,
        .navigate,
        .today-section,
        .toast {
          display: none;
        }
        .shell {
          max-width: none;
          padding: 0;
        }
        .masthead {
          height: 60px;
        }
        .intro {
          padding: 20px 0;
        }
        .day-row {
          padding: 8px 0;
          break-inside: avoid;
          grid-template-columns: 80px 1fr;
        }
        .day-courses {
          grid-template-columns: repeat(2, 1fr);
        }
        .course {
          padding: 10px;
        }
        .time {
          margin-top: 7px;
          font-size: 17px;
        }
        .location {
          font-size: 12px;
          margin: 5px 0;
        }
        .course-heading h3 {
          font-size: 17px;
        }
        .course-heading p {
          font-size: 12px;
        }
        .course-icon {
          width: 30px;
          height: 30px;
          font-size: 15px;
        }
        footer {
          padding: 10px 0;
        }
      }

      .week-hint {
        font-size: 13px;
        color: var(--muted);
        margin: -8px 0 16px;
      }
      .week-board {
        border: 1px solid #d7ded2;
        border-radius: 14px;
        overflow: hidden;
        background: var(--white);
      }
      .board-header,
      .board-row {
        display: grid;
        grid-template-columns: 90px minmax(0, 1fr);
      }
      .board-header {
        background: #edf1e8;
        color: #66775e;
        font-size: 13px;
      }
      .board-header > span {
        padding: 13px 18px;
      }
      .board-row {
        border-top: 1px solid #e4e7dd;
      }
      .board-row.selected-day {
        background: #f0f4eb;
      }
      .board-day {
        border-right: 1px solid #e4e7dd;
        display: flex;
        align-items: stretch;
      }
      .board-day button {
        border: 0;
        background: transparent;
        color: var(--ink);
        font-size: 18px;
        font-weight: 700;
        width: 100%;
        min-height: 65px;
        padding: 14px 8px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 5px;
      }
      .board-day button small {
        font-size: 10px;
        background: var(--green);
        color: white;
        padding: 2px 6px;
        border-radius: 4px;
        font-weight: 400;
      }
      .board-lessons {
        min-width: 0;
      }
      .summary-lesson {
        width: 100%;
        min-height: 65px;
        padding: 16px 24px;
        border: 0;
        background: transparent;
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
        align-items: center;
        text-align: left;
        gap: 15px;
        color: var(--ink);
      }
      .summary-lesson + .summary-lesson {
        border-top: 1px dashed #e0e4d8;
      }
      .summary-lesson:hover,
      .board-day button:hover {
        background: #e9efe1;
      }
      .summary-time {
        font-size: 18px;
        font-weight: 500;
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }
      .summary-name {
        font-size: 18px;
        font-weight: 700;
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .summary-name i {
        display: block;
        width: 6px;
        height: 20px;
        border-radius: 3px;
        flex-shrink: 0;
      }
      .summary-name i.blue {
        background: #859bb8;
      }
      .summary-name i.rose {
        background: #c29281;
      }
      .summary-name i.green {
        background: #8b9e74;
      }
      .summary-name i.amber {
        background: #c0a069;
      }
      .board-free {
        display: flex;
        align-items: center;
        min-height: 65px;
        padding: 16px 24px;
        color: #899081;
        font-size: 16px;
      }
      .today-section {
        scroll-margin-top: 15px;
      }
      @media (max-width: 650px) {
        .board-header,
        .board-row {
          grid-template-columns: 58px minmax(0, 1fr);
        }
        .board-header > span {
          padding: 12px 10px;
        }
        .board-day button {
          font-size: 16px;
          min-height: 64px;
        }
        .summary-lesson {
          padding: 14px 10px;
          grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr);
          gap: 6px;
          min-height: 64px;
        }
        .summary-time {
          font-size: 14px;
          letter-spacing: -0.35px;
        }
        .summary-name {
          font-size: 15px;
          gap: 6px;
        }
        .summary-name i {
          width: 4px;
          height: 17px;
        }
        .board-free {
          padding: 14px 10px;
          font-size: 14px;
          min-height: 64px;
        }
        .week-hint {
          font-size: 12px;
          line-height: 1.6;
        }
        .week-board {
          border-radius: 12px;
        }
      }
      @media (max-width: 360px) {
        .summary-lesson {
          grid-template-columns: 1fr;
          gap: 5px;
        }
        .summary-time {
          font-size: 14px;
        }
        .summary-name {
          font-size: 15px;
        }
      }
      @media print {
        .week-hint {
          display: none;
        }
        .board-row {
          break-inside: avoid;
        }
        .week-board {
          border-color: #aaa;
        }
        .summary-lesson {
          min-height: 48px;
          padding: 10px 18px;
        }
        .board-day button,
        .board-free {
          min-height: 48px;
        }
      }

      .week-toolbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 16px;
      }
      .week-paging {
        display: flex;
        gap: 6px;
      }
      .week-toolbar button {
        min-height: 42px;
        min-width: 42px;
        padding: 8px 13px;
        border: 1px solid #d4ddcf;
        border-radius: 8px;
        background: #fffefa;
        color: var(--green);
        font-size: 14px;
      }
      .week-paging button:first-child,
      .week-paging button:last-child {
        font-size: 22px;
        padding: 4px 10px;
      }
      .week-zoom[aria-pressed="true"] {
        background: #e6eddf;
      }
      .time-calendar-scroll {
        border: 1px solid #d6dfd1;
        border-radius: 12px;
        overflow: auto;
        background: #fffefa;
        padding-bottom: 20px;
      }
      .time-calendar {
        --axis: 66px;
        --hour: 72px;
        min-width: 0;
      }
      .time-calendar-scroll.zoomed .time-calendar {
        min-width: 940px;
      }
      .calendar-head {
        display: grid;
        grid-template-columns: var(--axis) repeat(7, minmax(0, 1fr));
        border-bottom: 1px solid #d7dfd2;
        background: #f1f4ed;
      }
      .calendar-head .corner {
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 12px;
        color: #708064;
        position: sticky;
        left: 0;
        background: #f1f4ed;
        z-index: 4;
      }
      .calendar-head button {
        border: 0;
        border-left: 1px solid #e2e7dc;
        min-height: 62px;
        padding: 8px 2px;
        background: transparent;
        color: var(--ink);
        display: flex;
        flex-direction: column;
        gap: 6px;
        align-items: center;
        justify-content: center;
      }
      .calendar-head strong {
        font-size: 15px;
      }
      .calendar-head span {
        font-size: 12px;
        color: #6f7f65;
      }
      .calendar-head .head-today {
        background: #dfe9d4;
      }
      .calendar-body {
        height: calc(13 * var(--hour));
        display: grid;
        grid-template-columns: var(--axis) repeat(7, minmax(0, 1fr));
      }
      .time-axis {
        position: sticky;
        left: 0;
        z-index: 3;
        background: #fffefa;
        color: #7c8972;
        font-size: 9px;
      }
      .time-axis > span {
        position: absolute;
        left: 0;
        width: 100%;
        transform: translateY(-50%);
        padding-right: 9px;
        text-align: right;
        line-height: 1.35;
      }
      .time-axis > span:first-child {
        transform: translateY(2px);
      }
      .time-axis b {
        font-size: 12px;
        color: #58694f;
        margin-left: 4px;
        font-weight: 500;
      }
      .calendar-day {
        position: relative;
        min-width: 0;
        border-left: 1px solid #dfe5d9;
        background: repeating-linear-gradient(
          to bottom,
          #dbe2d4 0px,
          #dbe2d4 1px,
          transparent 1px,
          transparent calc(var(--hour) / 2),
          #eef1e9 calc(var(--hour) / 2),
          #eef1e9 calc(var(--hour) / 2 + 1px),
          transparent calc(var(--hour) / 2 + 1px),
          transparent var(--hour)
        );
      }
      .calendar-day.calendar-today {
        background-color: #f3f7ed;
      }
      .calendar-event {
        position: absolute;
        left: 3px;
        right: 3px;
        padding: 4px 5px;
        border: 0;
        border-left: 3px solid currentColor;
        border-radius: 5px;
        display: flex;
        flex-direction: column;
        gap: 3px;
        align-items: flex-start;
        justify-content: flex-start;
        min-height: 0;
        overflow: hidden;
        text-align: left;
        line-height: 1.2;
        z-index: 1;
      }
      .calendar-event strong {
        font-size: 13px;
        font-weight: 700;
      }
      .calendar-event > span {
        font-size: 10px;
        white-space: nowrap;
        letter-spacing: -0.3px;
      }
      .calendar-event:hover {
        filter: brightness(0.96);
      }
      .calendar-footnote {
        font-size: 12px;
        color: #7c8873;
        margin: 12px 0 0;
        line-height: 1.6;
      }
      @media (max-width: 650px) {
        .time-calendar {
          --axis: 36px;
          --hour: 72px;
        }
        .calendar-head strong {
          font-size: 12px;
        }
        .calendar-head span {
          font-size: 10px;
        }
        .calendar-head button {
          min-height: 54px;
        }
        .calendar-head .corner {
          font-size: 10px;
        }
        .time-axis > span {
          padding-right: 3px;
          font-size: 8px;
        }
        .time-axis b {
          display: block;
          font-size: 10px;
          margin: 0;
        }
        .calendar-event {
          left: 1px;
          right: 1px;
          padding: 3px 1px;
          border-left-width: 2px;
          gap: 3px;
          border-radius: 3px;
        }
        .calendar-event strong {
          font-size: 10px;
          line-height: 1.1;
        }
        .calendar-event > span {
          font-size: 7px;
          letter-spacing: -0.35px;
        }
        .time-calendar-scroll.zoomed .calendar-event {
          padding: 4px 6px;
          border-left-width: 3px;
        }
        .time-calendar-scroll.zoomed .calendar-event strong {
          font-size: 14px;
        }
        .time-calendar-scroll.zoomed .calendar-event > span {
          font-size: 11px;
          letter-spacing: 0;
        }
        .time-calendar-scroll.zoomed .calendar-head strong {
          font-size: 16px;
        }
        .time-calendar-scroll.zoomed .calendar-head span {
          font-size: 12px;
        }
        .week-hint {
          margin-top: 0;
        }
        .calendar-footnote {
          font-size: 11px;
        }
      }
      @media print {
        .week-toolbar,
        .calendar-footnote {
          display: none;
        }
        .time-calendar {
          --hour: 46px;
          min-width: 0 !important;
        }
        .time-calendar-scroll {
          overflow: visible;
        }
        .calendar-event {
          print-color-adjust: exact;
          -webkit-print-color-adjust: exact;
        }
        .calendar-event strong {
          font-size: 10px;
        }
        .calendar-event > span {
          font-size: 9px;
        }
      }

      /* 简洁中文界面 */
      .intro {
        padding: 28px 0 18px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        border-bottom: 0;
      }
      .intro h1 {
        font-size: 30px;
        letter-spacing: 0;
      }
      .intro .share {
        margin: 0;
        min-height: 44px;
        padding: 0 15px;
        font-size: 15px;
      }
      .intro .share span {
        padding-left: 6px;
      }
      .settings {
        padding-bottom: 20px;
        font-size: 13px;
      }
      .settings select {
        max-width: 120px;
        font-size: 13px;
      }
      .today-section {
        padding: 24px;
        margin-bottom: 30px;
      }
      .section-head {
        margin-bottom: 18px;
      }
      .course-heading h3 {
        margin: 0;
      }
      .course-top {
        min-height: 42px;
      }
      .address-details {
        margin: 15px 0 18px;
        font-size: 14px;
        color: var(--muted);
      }
      .address-details summary {
        min-height: 40px;
        display: flex;
        align-items: center;
        gap: 8px;
        cursor: pointer;
        list-style: none;
      }
      .address-details summary::-webkit-details-marker {
        display: none;
      }
      .address-details summary svg {
        width: 17px;
        height: 20px;
      }
      .address-details summary > span {
        font-size: 12px;
        margin-left: auto;
        color: #6c8061;
      }
      .address-details[open] summary > span {
        visibility: hidden;
      }
      .address-details p {
        font-size: 15px;
        line-height: 1.7;
        margin: 6px 0 0;
        overflow-wrap: anywhere;
      }
      .week-toolbar {
        margin-bottom: 12px;
      }
      .week-hint {
        margin: 0 0 12px;
        font-size: 12px;
      }
      footer {
        padding: 22px 0 28px;
        font-size: 12px;
      }
      .empty {
        padding: 16px;
      }
      .empty h3 {
        margin-bottom: 0;
      }
      .week-section .section-head {
        margin-bottom: 16px;
      }
      @media (min-width: 800px) {
        .today-cards:has(> .course:only-child) .featured .address-details {
          grid-column: 1;
          margin-bottom: 0;
        }
      }
      @media (max-width: 650px) {
        .intro {
          padding: 22px 0 12px;
          display: flex;
        }
        .intro h1 {
          font-size: 27px;
        }
        .intro .share {
          margin: 0;
          min-height: 42px;
          padding: 0 13px;
        }
        .settings {
          padding-bottom: 14px;
        }
        .today-section {
          padding: 16px 13px;
          margin-bottom: 26px;
        }
        .today-section .section-head {
          gap: 12px;
        }
        .featured .time {
          margin-top: 18px;
          font-size: 24px;
        }
        .course {
          padding: 17px 14px;
        }
        .address-details {
          margin: 9px 0 13px;
        }
        .today-cards .course-top {
          min-height: 38px;
        }
        .course-icon {
          width: 38px;
          height: 38px;
          font-size: 17px;
        }
        .week-section .section-head {
          margin-bottom: 14px;
        }
        .week-toolbar button {
          min-height: 40px;
        }
        .calendar-footnote {
          font-size: 11px;
        }
      }
    </style>
