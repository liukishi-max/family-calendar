    <link rel="apple-touch-icon" href="./share-cover.png" />

    <style>
      :root {
        --ink: #243d35;
        --muted: #67756c;
        --green: #2d5947;
        --line: #dedfd6;
        --paper: #faf9f5;
        --white: #fffefa;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--paper);
        color: var(--ink);
        font-family: Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      button,
      a,
      select {
        -webkit-tap-highlight-color: transparent;
      }
      button,
      select {
        font: inherit;
      }
      button,
      a,
      select {
        touch-action: manipulation;
      }
      button {
        cursor: pointer;
      }
      button:focus-visible,
      a:focus-visible,
      select:focus-visible {
        outline: 3px solid #b57928;
        outline-offset: 4px;
      }
      button:disabled {
        opacity: 0.4;
      }
      .shell {
        max-width: 1080px;
        padding: 0 42px;
        margin: auto;
      }
      .masthead {
        height: 94px;
        border-bottom: 1px solid var(--line);
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .brand {
        display: flex;
        gap: 12px;
        align-items: center;
        font-size: 20px;
        font-weight: 700;
        letter-spacing: 1px;
      }
      .brand-icon {
        width: 42px;
        height: 42px;
        display: grid;
        place-items: center;
        background: #e8eddf;
        border-radius: 14px;
        font-size: 28px;
        color: #687947;
      }
      .brand-sub {
        display: block;
        font-size: 9px;
        letter-spacing: 2px;
        margin-top: 5px;
        font-weight: 500;
        color: var(--muted);
      }
      .family-label {
        font-size: 13px;
        color: var(--muted);
        border: 1px solid var(--line);
        padding: 7px 13px;
        border-radius: 30px;
      }
      .intro {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 20px;
        padding: 42px 0 26px;
      }
      .eyebrow {
        font-size: 11px;
        letter-spacing: 2px;
        color: #637f60;
        font-weight: 700;
        margin: 0 0 12px;
      }
      .intro .eyebrow {
        font-size: 13px;
        letter-spacing: 3px;
      }
      h1 {
        font-size: 38px;
        letter-spacing: -1px;
        line-height: 1.3;
        margin: 0;
        font-weight: 700;
      }
      .subtitle {
        color: var(--muted);
        font-size: 16px;
        margin: 14px 0 0;
      }
      .share {
        min-height: 46px;
        border: 1px solid #c5ccbf;
        background: transparent;
        border-radius: 10px;
        padding: 0 17px;
        font-weight: 600;
        color: var(--green);
        white-space: nowrap;
      }
      .share span {
        padding-left: 12px;
        font-size: 20px;
      }
      .settings {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 0 0 26px;
        font-size: 13px;
        color: var(--muted);
      }
      .dot {
        display: inline-block;
        width: 7px;
        height: 7px;
        background: #64875b;
        border-radius: 50%;
        margin-right: 7px;
      }
      .settings label {
        display: flex;
        gap: 8px;
        align-items: center;
      }
      .settings select {
        min-height: 44px;
        border: 0;
        background: transparent;
        color: var(--ink);
        max-width: 145px;
      }
      .today-section {
        background: #eef1e8;
        border: 1px solid #dce3d6;
        border-radius: 20px;
        padding: 28px;
        margin-bottom: 42px;
      }
      .section-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 15px;
        margin-bottom: 22px;
      }
      h2 {
        font-size: 25px;
        font-weight: 700;
        margin: 0;
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .count {
        font-size: 13px;
        font-weight: 500;
        color: #536c51;
        background: #dfe7d7;
        padding: 5px 10px;
        border-radius: 20px;
      }
      .date-navigation {
        display: flex;
        align-items: center;
        gap: 9px;
        font-size: 14px;
      }
      .date-navigation button {
        border: 1px solid #d1dacb;
        background: #f8faf4;
        border-radius: 8px;
        min-height: 44px;
        min-width: 44px;
        color: var(--green);
        font-size: 25px;
      }
      .date-navigation span {
        white-space: nowrap;
      }
      .today-cards {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
        gap: 16px;
      }
      .course {
        background: var(--white);
        padding: 23px;
        border: 1px solid #e2e3da;
        border-radius: 14px;
        min-width: 0;
      }
      .course-top {
        display: flex;
        align-items: center;
        gap: 13px;
      }
      .course-icon {
        width: 43px;
        height: 43px;
        border-radius: 12px;
        display: grid;
        place-items: center;
        flex-shrink: 0;
        font-size: 19px;
        font-weight: 700;
      }
      .blue {
        background: #e7edf6;
        color: #4c6381;
      }
      .rose {
        background: #f4e5df;
        color: #965d4d;
      }
      .green {
        background: #e7eddf;
        color: #64754d;
      }
      .amber {
        background: #f5ebd6;
        color: #947338;
      }
      .course-heading {
        min-width: 0;
      }
      .course-heading h3 {
        font-size: 21px;
        margin: 0 0 5px;
        font-weight: 700;
      }
      .course-heading p {
        font-size: 14px;
        margin: 0;
        color: var(--muted);
      }
      .duration {
        margin-left: auto;
        font-size: 12px;
        color: var(--muted);
        white-space: nowrap;
      }
      .time {
        font-size: 21px;
        font-weight: 700;
        margin-top: 20px;
        line-height: 1.6;
        letter-spacing: -0.4px;
      }
      .time span {
        font-weight: 400;
        color: #8d988c;
        font-size: 16px;
        margin: 0 4px;
      }
      .featured .time {
        font-size: 29px;
        margin-top: 24px;
      }
      .location {
        display: flex;
        align-items: flex-start;
        gap: 9px;
        color: #5f6d62;
        font-size: 15px;
        line-height: 1.7;
        margin: 12px 0 21px;
        overflow-wrap: anywhere;
      }
      .location svg {
        width: 16px;
        height: 19px;
        flex-shrink: 0;
        margin-top: 3px;
      }
      .navigate {
        background: #edf1e9;
        border: 1px solid #d7dfd1;
        color: var(--green);
        text-decoration: none;
        border-radius: 9px;
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 9px;
        font-size: 17px;
        font-weight: 700;
        min-height: 49px;
      }
      .navigate svg {
        width: 18px;
        height: 21px;
      }
      .navigate > span {
        margin-left: 6px;
      }
      .featured .navigate {
        background: var(--green);
        color: white;
        border-color: var(--green);
        min-height: 54px;
      }
      .navigate:hover {
        filter: brightness(0.96);
      }
      .back-today {
        color: var(--green);
        border: 1px solid #c6d2bd;
        background: #fffdf7;
        padding: 11px 15px;
        border-radius: 9px;
        margin: 0 0 18px;
        font-size: 14px;
      }
      .week-section .eyebrow {
        color: var(--muted);
      }
      .week-range {
        font-size: 14px;
        color: var(--muted);
      }
      .week-list {
        border-top: 1px solid var(--line);
      }
      .day-row {
        display: grid;
        grid-template-columns: 106px 1fr;
        gap: 20px;
        padding: 24px 0;
        border-bottom: 1px solid var(--line);
      }
      .day-label {
        padding-top: 8px;
      }
      .day-label strong {
        display: block;
        font-size: 18px;
      }
      .day-label > span {
        display: block;
        color: var(--muted);
        font-size: 14px;
        margin-top: 8px;
      }
      .day-label small {
        display: inline-block;
        margin-top: 10px;
        background: var(--green);
        color: white;
        border-radius: 4px;
        padding: 4px 8px;
        font-size: 11px;
      }
      .day-courses {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
        gap: 14px;
      }
      .rest {
        padding: 18px 0;
        font-size: 17px;
        color: #687764;
      }
      .rest span {
        display: block;
        font-size: 14px;
        margin-top: 7px;
        color: #7d8779;
      }
      .empty {
        padding: 25px;
        text-align: center;
      }
      .empty > span {
        font-size: 40px;
        color: #87966e;
      }
      .empty h3 {
        font-size: 23px;
        margin: 12px 0;
      }
      .empty p {
        color: var(--muted);
        font-size: 16px;
      }
      footer {
        padding: 30px 0 38px;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.8;
      }
      footer p {
        margin: 4px 0;
      }
      footer > span {
        display: block;
        margin-top: 22px;
        font-size: 13px;
        letter-spacing: 1px;
      }
      .note {
        font-size: 15px;
        line-height: 1.7;
      }
      .change {
        font-size: 13px;
        color: #94642f;
      }
      .toast {
        position: fixed;
        left: 50%;
        bottom: 25px;
        transform: translateX(-50%);
        background: #243d35;
        color: white;
        border-radius: 12px;
        padding: 15px 22px;
        max-width: 90vw;
